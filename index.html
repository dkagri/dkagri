<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DK Agri | Agriculture Information System</title>
    <meta name="description" content="Welcome to DK Agri, your trusted Agriculture Information System. Calculate crop spacing, convert land area, and learn about crops and pesticides easily.">
    <meta name="keywords" content="dk agri, dk agriculture, agriculture information system">
    <meta name="robots" content="index, follow">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:url('first.jpg') center/cover no-repeat fixed;
}

/* OVERLAY */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  z-index:-1;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#2e7d32,#1b5e20);
  color:#fff;
  text-align:center;
  padding:45px 20px;
}
header h1{ font-size:38px; }
header p{ margin-top:10px; font-size:15px; opacity:0.9; }

/* MAIN CARDS */
.infomation{
  max-width:1200px;
  margin:30px auto 10px;
  padding:35px;
  background:rgba(236,247,236,0.97);
  border-radius:16px;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}
.card{
  background:#fff;
  border-radius:14px;
  padding:35px 20px;
  overflow:hidden;
  text-align:center;
  box-shadow:0 8px 18px rgba(0,0,0,0.18);
  transition:0.35s;
}
.card-img{
  display:none;
}
.card:hover{
  background:#1e88e5;
  transform:translateY(-8px);
}

.card a{
  text-decoration:none;
  font-size:18px;
  font-weight:bold;
  color:#1e88e5;
}
.card:hover a{ color:#fff; }

/* Desktop only buttons below all ads */
.desktop-buttons{
  text-align:center;
  margin-top:20px;
}

.desktop-buttons button{
  min-width:160px;
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:#fff;
  margin:0 8px;
}
@media (max-width:600px){
  .email{
    display:none;
  }
}
.whatsapp{ background:#25D366; }
.email{ background:#1976d2; }
.call{background:#e53935;}
.desktop-buttons button:hover{ opacity:0.9; }

/* TABLET CARDS */
@media (max-width:991px){
  .infomation{ grid-template-columns:repeat(2,1fr); }
}

/* MOBILE CARDS */
@media (max-width:600px){
  header h1{ font-size:26px; }
  .infomation{ grid-template-columns:1fr; padding:20px; margin:20px; }
}
@media (min-width:992px){

  .card{
    padding:0;
  }

  .card-img{
    display:block;
    height:170px;
    background-size:cover;
    background-position:center;
  }

  .card a{
    display:block;
    padding:25px;
  }
/* ✅ Contact Us Center */
  .infomation .card:last-child{
    grid-column:2 / 3;
  }
}
/* FOOTER */
footer{
  margin-top:auto;
  background:#000;
  color:#fff;
  text-align:center;
  padding:14px;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>Welcome to DK Agri</h1>
  <p>AGRICULTURE INFORMATION SYSTEM</p>
</header>

<section class="infomation"><div class="card">
  <div class="card-img" style="background-image:url('images/crops.jpg');"></div>
  <a href="crop.html">🌾 Crops</a>
</div>

<div class="card">
  <div class="card-img" style="background-image:url('images/pesticide.jpg');"></div>
  <a href="pesticide.html">🐛 Pesticide</a>
</div>

<div class="card">
  <div class="card-img" style="background-image:url('images/spacing.jpg');"></div>
  <a href="spacing.html">📏 Crop Spacing Calculator</a>
</div>

<div class="card">
  <div class="card-img" style="background-image:url('images/area.jpg');"></div>
  <a href="area_converter.html">🚜 Area Converter</a>
</div>

<div class="card">
  <div class="card-img" style="background-image:url('images/presentation.jpg');"></div>
  <a href="presentation.html">📊 Presentation</a>
</div>

<div class="card">
  <div class="card-img" style="background-image:url('images/extension.jpg');"></div>
  <a href="extention.html">🗃️ Extension</a>
</div>

<div class="card">
  <div class="card-img" style="background-image:url('images/contact.jpg');"></div>
  <a href="contact.html">📞 Contact Us</a>
</div>
</section>

<footer>
© 2026 DK AGRI
</footer>

<script>
// MOBILE AUTO-SLIDE ADS
const ads = document.querySelectorAll('.ads-grid .ad-box');
let current = 0;

function showNextAd(){
  ads.forEach((ad,i)=> ad.classList.remove('active'));
  ads[current].classList.add('active');
  current = (current + 1) % ads.length;
}

// Only run auto-slide on mobile/tablet
function checkSlide(){
  if(window.innerWidth <= 800){
    showNextAd();
    setInterval(showNextAd, 5000); // every 5 seconds
  } else {
    ads.forEach(ad=> ad.classList.add('active')); // show all ads in desktop
  }
}

window.addEventListener('load', checkSlide);
window.addEventListener('resize', ()=>{
  ads.forEach(ad=> ad.classList.remove('active'));
  checkSlide();
});
</script>

</body>
</html>
