<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agriculture</title>

<style>
*{
  box-sizing: border-box;
}

body{
  margin: 0;
  font-family: Arial, sans-serif;

  background-image: url('first.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
}

/* Overlay */
body::before{
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: -1;
}

header{
  background: green;
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1{
  margin: 0;
}

header p{
  margin-top: 8px;
  font-size: 14px;
}

/* MAIN SECTION */
.infomation{
  background: rgba(200,230,201,0.95);
  padding: 30px 20px;
  margin: 20px;
  border-radius: 12px;

  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
}

/* CARD */
.card{
  background: white;
  border-radius: 10px;
  padding: 25px 15px;
  text-align: center;
  transition: 0.3s;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.card:hover{
  background: #1e88e5;
  transform: translateY(-5px);
}

.card a{
  text-decoration: none;
  color: #1e88e5;
  font-weight: bold;
  font-size: 16px;
  display: block;
}

.card:hover a{
  color: white;
}

/* FOOTER */
footer{
  background: black;
  color: white;
  text-align: center;
  padding: 12px;
  margin-top: auto;
}

/* MOBILE */
@media (max-width:600px){
  header h1{
    font-size: 22px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Welcome</h1>
  <p>AGRICULTURE INFORMATION SYSTEM</p>
</header>

<section class="infomation">

  <div class="card">
    <a href="crop.html">🌾 Crops</a>
  </div>
  
  <div class="card">
    <a href="pesticide.html">🐛 pesticide</a>
  </div>

  <div class="card">
    <a href="spacing.html">📏 Crop Spacing Calculator</a>
  </div>

  <div class="card">
    <a href="area_converter.html">🚜 Area Converter</a>
  </div>

  <div class="card">
    <a href="presentation.html">📊 Presentation</a>
  </div>

  
  <div class="card">
    <a href="contact.html">📞 Contact us</a>
  </div>

</section>

<footer>
© 2026 DK AGRI | Educational & Extension Use Only
</footer>

</body>
</html>
