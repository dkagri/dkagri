<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact – DK Agri</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f7;
  margin:0;
  padding:15px;
}

h2{
  text-align:center;
  color:#2e7d32;
}

/* TOP BUTTONS */
.top-buttons{
  max-width:850px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.top-buttons button{
  padding:8px 18px;
  border:none;
  background:#2e7d32;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
}

.top-buttons button:hover{
  background:#1b5e20;
}

/* CARD */
.card{
  max-width:850px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* CONTACT BUTTONS */
.contact-buttons{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap;
}

.contact-buttons a{
  text-decoration:none;
}

.contact-buttons button{
  min-width:200px;
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:#fff;
}

.whatsapp{ background:#25D366; }
.call{background:#e53935;}
.email{ background:#1976d2; }

.contact-buttons button:hover{
  opacity:0.9;
}

/* ADVERTISEMENT MAIN CARD (WIDER) */
.ads-main{
  max-width:1200px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* AD GRID */
.ads-container{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

/* SINGLE AD */
.ad-card{
  flex:1 1 calc(33.33% - 20px);
}

.ad-box{
  height:100%;
  padding:15px;
  border:2px dashed #4caf50;
  text-align:center;
  border-radius:8px;
  background:#f9fff9;
}

.ad-box img{
  max-width:100%;
  height:auto;
  border-radius:6px;
  margin:10px 0;
}

/* RESPONSIVE */
@media (max-width:900px){
  .ad-card{
    flex:1 1 calc(50% - 20px);
  }
}

@media (max-width:600px){
  .ad-card{
    flex:1 1 100%;
  }
}

/* FOOTER */
footer{
  text-align:center;
  margin-top:30px;
  color:#555;
  font-size:14px;
}
</style>
</head>

<body>

<h2>Contact Us</h2>

<div class="top-buttons">
  <button onclick="location.href='index.html'">🏠 Home</button>
  <button onclick="history.back()">🔙 Back</button>
</div>

<!-- CONTACT INFO -->
<div class="card">
  <h3 style="text-align:center;color:#388e3c;">Get in Touch</h3>
  <p style="text-align:center;">
    Agricultural information, training,  extension support & web designing
  </p>

  <div class="contact-buttons">
    <a href="https://wa.me/94758656258?text=Hello%20DK🤝" target="_blank">
      <button class="whatsapp">📱 WhatsApp</button>
    </a>
    <a href="tel:+94758656258">
  <button class="call">📞 Call</button>
</a>

    <a href="mailto:gdkgdk1194@gmail.com?subject=Agri information">
      <button class="email">📧 Email</button>
    </a>
  </div>
</div>

<!-- ADVERTISEMENTS -->
</div>

<footer>
  © 2026 DK Agri – Educational & Extension Use
</footer>

</body>
  </html>
