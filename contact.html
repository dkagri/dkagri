<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact – DK Agri</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f7;
  margin:0;
  padding:15px;
}

h2{
  text-align:center;
  color:#2e7d32;
}

/* TOP BUTTONS */
.top-buttons{
  max-width:850px;
  margin:auto;
  display:flex;
  justify-content:space-between;
}

.top-buttons button{
  padding:8px 18px;
  border:none;
  background:#2e7d32;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
}

/* CARD */
.card{
  max-width:850px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* CONTACT BUTTONS */
.contact-buttons{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.contact-buttons button{
  min-width:200px;
  padding:12px;
  border:none;
  border-radius:6px;
  color:#fff;
  cursor:pointer;
}

.whatsapp{background:#25D366;}
.email{background:#1976d2;}

/* ================= SLIDER ================= */

.ads-main{
  max-width:1200px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  overflow:hidden;
}

.slider-window{
  overflow:hidden;
}

.ads-track{
  display:flex;
  transition:transform 0.6s ease-in-out;
}

/* single ad */
.ad-card{
  min-width:33.33%;
  padding:10px;
}

.ad-box{
  height:100%;
  border:2px dashed #4caf50;
  padding:15px;
  border-radius:8px;
  background:#f9fff9;
  text-align:center;
}

.ad-box img{
  max-width:100%;
  border-radius:6px;
  margin:10px 0;
}

/* RESPONSIVE */
@media(max-width:900px){
  .ad-card{min-width:50%;}
}
@media(max-width:600px){
  .ad-card{min-width:100%;}
}

/* FOOTER */
footer{
  text-align:center;
  margin-top:30px;
  font-size:14px;
  color:#555;
}
</style>
</head>

<body>

<h2>Contact Us</h2>

<div class="top-buttons">
  <button onclick="location.href='index.html'">🏠 Home</button>
  <button onclick="history.back()">🔙 Back</button>
</div>

<div class="card">
  <h3 style="text-align:center;color:#388e3c;">Get in Touch</h3>
  <p style="text-align:center;">Agricultural information & support</p>

  <div class="contact-buttons">
    <a href="https://wa.me/94758656258" target="_blank">
      <button class="whatsapp">📱 WhatsApp</button>
    </a>
    <a href="mailto:dkagri@example.com">
      <button class="email">📧 Email</button>
    </a>
  </div>
</div>

<!-- ===== AUTO SLIDING ADS ===== -->
<div class="ads-main">
<h3 style="text-align:center;color:#2e7d32;">Advertisement</h3>

<div class="slider-window">
<div class="ads-track" id="adsTrack">

  <div class="ad-card">
    <div class="ad-box">
      <h4>CV MAKING</h4>
      <p>PDF to Website</p>
      <img src="cv.jpg">
      <button class="whatsapp">WhatsApp</button>
    </div>
  </div>

  <div class="ad-card">
    <div class="ad-box">
      <h4>SHOP MAKING</h4>
      <p>Online Shop</p>
      <img src="shop.jpg">
      <button class="whatsapp">WhatsApp</button>
    </div>
  </div>

  <div class="ad-card">
    <div class="ad-box">
      <h4>WEBSITE DESIGN</h4>
      <p>Business & Agri</p>
      <img src="web.jpg">
      <button class="whatsapp">WhatsApp</button>
    </div>
  </div>

  <!-- duplicate for infinite effect -->
  <div class="ad-card">
    <div class="ad-box">
      <h4>CV MAKING</h4>
      <p>PDF to Website</p>
      <img src="cv.jpg">
      <button class="whatsapp">WhatsApp</button>
    </div>
  </div>

</div>
</div>
</div>

<footer>
© 2026 DK Agri – Educational & Extension Use
</footer>

<script>
const track = document.getElementById("adsTrack");
let index = 0;

function slideAds(){
  const cards = document.querySelectorAll(".ad-card");
  const visible = window.innerWidth <= 600 ? 1 : window.innerWidth <= 900 ? 2 : 3;
  index++;

  if(index > cards.length - visible){
    index = 0;
  }

  const width = cards[0].offsetWidth;
  track.style.transform = `translateX(-${index * width}px)`;
}

setInterval(slideAds,3000);
</script>

</body>
</html>
