<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vegetable Crop Information</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}

h2{
  text-align: center;
  color: #2e7d32;
}

/* BUTTON BAR */
.top-buttons{
  max-width: 750px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
}

.top-buttons button{
  padding: 8px 16px;
  border: none;
  background: #2e7d32;
  color: #fff;
  cursor: pointer;
  border-radius: 5px;
}

select{
  display: block;
  margin: 20px auto;
  padding: 10px;
  font-size: 16px;
  width: 100%;
  max-width: 400px;
}

table{
  width: 100%;
  max-width: 750px;
  margin: auto;
  border-collapse: collapse;
  background: #fff;
}

th, td{
  border: 1px solid #000;
  padding: 10px;
}

th{
  background: #4caf50;
  color: #fff;
  width: 40%;
  text-align: left;
}
/* DROPDOWN SECTIONS */
.section{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.section-header{
  padding:14px;
  background:#e8f5e9;
  color:#2e7d32;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}
/* PESTICIDE BUTTONS */
.pest-buttons{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:15px;
}

.pest-buttons button{
  background:#388e3c;
  color: white;
  padding: 18px;
  font-size: 18px;
}
.section-content{
  display:none;
  padding:15px;
}
footer{
  text-align: center;
  margin-top: 30px;
  color: #555;
}
</style>
</head>

<body>

<h2>Vegetable Crop Details</h2>

<div class="top-buttons">
  <button onclick="location.href='index.html'">🏠 Home</button>
  <button onclick="history.back()">🔙 Back</button>
</div>

<select onchange="showData(this.value)">
  <option value="">-- Select Crop --</option>
  <option value="cabbage">Cabbage</option>
  <option value="radish">Radish</option>
  <option value="carrot">Carrot</option>
  <option value="tomato">Tomato</option>
  <option value="capsicum">Capsicum</option>
  <option value="brinjal">Brinjal</option>
  <option value="okra">Okra</option>
  <option value="beans">Beans</option>
  <option value="wingedbean">Winged Bean</option>
  <option value="yardlongbean">Yard Long Bean</option>
  <option value="pumpkin">Pumpkin</option>
  <option value="potato">Potato</option>
  <option value="cucumber">Cucumber</option>
  <option value="snakegourd">Snake Gourd</option>
  <option value="luffa">Luffa</option>
  <option value="bittergourd">Bitter Gourd</option>
  <option value="beetroot">Beet Root</option>
  <option value="leeks">Leeks</option>
  <option value="elabatu">Ela Batu</option>
  <option value="kekiri">Kekiri</option>
  <option value="thumbakarawila">Thumba Karawila</option>
  <option value="knolkhol">Knol Khol</option>
</select>

<table>
  <tbody id="tableData">
    <tr>
      <td colspan="2" style="text-align:center;">
        Please select a crop
      </td>
    </tr>
  </tbody>
</table>

<div class="section">
  <div class="section-header" onclick="toggleSection(this)">
    Pesticide Recommendation <span>▼</span>
  </div>
  <div class="section-content">
    <div class="pest-buttons">
      <button onclick="location.href='vegetable-pest.html'">Insecticide</button>
      <button onclick="location.href='vegetable-fungicide.html'">Fungicide</button>
      <button onclick="location.href='vegetable-herbicide.html'">Herbicide</button>
    </div>
  </div>
</div>

<footer>
  DK Agri – Learning Project
</footer>

<script>

const crops = {
  cabbage:{
    scientific:"Brassica oleracea",
    variety:"Green Coronet",
    seed:"200-250 g/ha",
    spacing:"50 × 40",
    days:"90 – 110",
    harvest:"40 mt/ha"
  },
  radish:{
    scientific:"Raphanus sativus",
    variety:"Japan bola, Beralu",
    seed:"5 kg/ha",
    spacing:"30 × 10",
    days:"25 – 35",
    harvest:"Japan bola 15 – 20 mt/ha, Beralu 20 - 30 mt/ha"
  },
  carrot:{
    scientific:"Daucus carota",
    variety:"New Kuroda, Lanka Carrot, Cape Market",
    seed:"4 kg/ha",
    spacing:"25 × 5 cm",
    days:"80 – 100",
    harvest:"local 30 – 35 mt/ha, Hybrit 55- 60 mt/ha"
  },
  tomato:{
    scientific:"Solanum lycopersicon",
    variety:"HORDI Tomato hybrid 03, Thilina, KWR, T245, Ravi, Lanka Sour (Goraka Takkali), Maheshi, Tharindu, Rajitha, Rashmi, Bhathiya, KC 1, Lanka Cherry, Abiman, Glory	",
    seed:"200 – 250 g/ha",
    spacing:"60 × 50",
    days:"80 – 50",
    harvest:"25 – 30 mt/ha"
  },
  capsicum:{
    scientific:"Capsicum annuum",
    variety:"CA 8, Hungarian Yellow Wax (HYW), Gannoruwa Prarthana (F1), Muriya",
    seed:"CA-8, Perarthana 100p g/ha, HYW, 1750 g/ha",
    spacing:"40 × 40 cm",
    days:"90 – 120",
    harvest:"15 – 20 mt/ha"
  },
  brinjal:{
    scientific:"Solanum melongena",
    variety:"Amanda F1, Anjalee-F1, HORDI Lenairi 1, Thinnaweli purple, Padagoda, SM 164, Raveena",
    seed:"200 – 300 g/ha",
    spacing:"90 × 60",
    days:"90 – 120",
    harvest:"15 – 18 mt/ha"
  },
  okra:{
    scientific:"Abelmoschus esculentus",
    variety:"Haritha, MI 5, MI 7, OKH1",
    seed:"4.5 kg/ha",
    spacing:"90 × 60 cm",
    days:"50 – 100",
    harvest:"10 – 15 mt/ha, OKH1 - 30 t/ha"
  },
  beans:{
    scientific:"Phaseolus vulgaris",
    variety:"Balangoda Nil, Bandarawela Green, Gannoruwa BIL, Kekulu Bonchi, Gannoruwa Green, Kappetipola Nil, HORDI Green, Kentucky Wonder Green- KWG, Lanka Butter, HORDI Bean-03(HORDI Pokuru), <br><br> Bush types (Bush Bean)- Cherokee Wax, Sanjaya, Wade, Top Crop",
    seed:"50 kg/ha",
    spacing:"45 × 30",
    days:"45 – 55",
    harvest:"18 – 20 mt/ha"
  },
  wingedbean:{
    scientific:"Psophocarpus tetragonolobus",
    variety:"SLS 44, Krishna",
    seed:"21 - 23 kg/ha",
    spacing:"75 × 60",
    days:"75 – 90",
    harvest:"SLS 44 - 15 – 20 mt/ha, Krishna 27 mt/ha"
  },
  yardlongbean:{
    scientific:"Vigna unguiculata",
    variety:"Gannoruwa Hawari, Gannoruwa A9 mae, Hawari Mae, Sena, Polon Mae, Bushita (Local), BS1, Bush Polon Mae",
    seed:"16-20 kg/ha",
    spacing:"90 × 30",
    days:"60 – 75",
    harvest:"10 – 25 mt/ha"
  },
 pumpkin:{
    scientific:"Cucurbita maxima",
    variety:"Pathma, A.N.K., Local Strains, Butternut, Arjuna",
    seed:"1 kg/ha",
    spacing:"Local Strain – 3 x 3m <br> A.N.K. – 2.5 x 2.5 m <br> Butternut – 50 x 100",
    days:"90 – 120",
    harvest:"20 – 25 mt/ha"
  },
  potato:{
    scientific:"Solanum tuberosum",
    variety:"Golden Star, Granola",
    seed:"2000 kg tubers /ha",
    spacing:"60 × 25",
    days:"90 – 120",
    harvest:"20 – 25 mt/ha"
  },
  cucumber:{
    scientific:"Cucumis sativus",
    variety:"HORDI Green, HORDI White, Kalpitiya white, Champion, Gannoruwa white, LY 58",
    seed:"1 kg/ha",
    spacing:"100 × 100",
    days:"50 – 60",
    harvest:"15 – 20 mt/ha"
  },
  snakegourd:{
    scientific:"Trichosanthes cucumerina",
    variety:"TA-2, MI-Short, Thinnaweli",
    seed:"4 kg/ha",
    spacing:"150 × 150",
    days:"90 – 120",
    harvest:"20 mt/ha"
  },
  luffa:{
    scientific:"Luffa acutangula",
    variety:"LA33, Asiri, Gannoruwa Ari",

    days:"90 – 120",
    harvest:"10 – 12 mt/ha"
  },
  bittergourd:{
    scientific:"Momordica charantia",
    variety:"MC-43, Thinneweli white, Mathale Green, Neerogi, MG",
    seed:"6 kg/ha",

    days:"90 – 120",
    harvest:"20 mt/ha"
  },
  beetroot:{
    scientific:"Beta vulgaris",
    variety:"Crimson Globe, Detroit Dark Red",
    seed:"5 – 6 kg/ha",
    spacing:"30 × 10",
    days:"70 – 90",
    harvest:"12 – 20 mt/ha"
  },
  leeks:{
    scientific:"Allium ampeloprasum",
    variety:"Large Long Summer, Jumbo",
    seed:"3.750 kg/ha",
    spacing:"15 × 10",
    days:"120 – 150",
    harvest:"20 - 30 mt/ha"
  },
  elabatu:{
    scientific:"Solanum insanum",
    variety:"GK Elabatu 1 (Manike), GK Elabatu 2 (Tikira)",
    seed:"250-300 g/ha",
    spacing:"60 × 60",
    days:"90 – 120",
    harvest:"20 – 25 mt/ha"
  },
  kekiri:{
    scientific:"Cucumis melo",
    variety:"Local",
    seed:"500 g/ha",
    spacing:"100 × 100",
    days:"75 – 90",
    harvest:"25 – 30 mt/ha"
  },
  thumbakarawila:{
    scientific:"Momordica dioica ex Roxb.Willd",
    variety:"Female plant varieties – Thumbika / Golika / Wisal / Kesara / Chandu <br> Male plant Varieties – Parakum, wishma <br> Hybrid: Female -Chandu, male – Wishma",
    seed:"Required 6000 healthy female seedlings and 1000 male seedlings in the ratio of 6: 1 per hectare and 6000 healthy female seedlings and 600 male seedlings in the ratio of 10: 1. Both fruiting and flowering vines are required for fruiting",
    spacing:"150 × 100",
    days:"120 – 150",
    harvest:"Fruit yield 6.0 – 8.0 kg per year can be obtained from one female vine"
  },
  knolkhol:{
    scientific:"Brassica oleracea",
    variety:"Takashi",
    seed:"Short duration varieties – 600 – 750 g/ha <br> Long duration varieties – 375 – 400 g/ha",
    spacing:"30 × 10 <br> Intercropping <br> cabbage – 50 x 50 cm <br> chili – 60 x 60 cm",
    days:"60 – 75",
    harvest:"Intercropping <br> cabbage – 8000 kg/ ha <br> chili – 2200 kg / ha"
  }
};

function showData(crop){
  if(!crops[crop]){
    tableData.innerHTML="<tr><td colspan='2'>Select a crop</td></tr>";
    return;
  }

  let c = crops[crop];
  let [r,p] = c.spacing.split("×").map(v=>parseFloat(v)/100);
  let plants = Math.round(ACRE/(r*p));

  tableData.innerHTML = `
    <tr><th>Scientific Name</th><td><i>${c.scientific}</i></td></tr>
    <tr><th>Variety</th><td>${c.variety}</td></tr>
    <tr><th>Seed Requirement</th><td>${c.seed}</td></tr>
    <tr><th>Spacing</th><td>${c.spacing} cm</td></tr>
    <tr><th>Plants / Acre</th><td><b>${plants.toLocaleString()}</b></td></tr>
    <tr><th>Crop Duration</th><td>${c.days} days</td></tr>
    <tr><th>Harvest</th><td>${c.harvest}</td></tr>
  `;
}
function toggleSection(header){
  const content = header.nextElementSibling;
  const arrow = header.querySelector("span");
  if(content.style.display === "block"){
    content.style.display = "none";
    arrow.innerHTML = "▼";
  }else{
    content.style.display = "block";
    arrow.innerHTML = "▲";
  }
}

</script>

</body>
</html>
