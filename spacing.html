<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Spacing Calculator</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: #e8f5e9;
  padding: 20px;
}

.container{
  max-width: 450px;
  margin: auto;
  background: #ffffff;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

h2{
  text-align: center;
  color: green;
  margin-bottom: 20px;
}

label{
  font-weight: bold;
  display: block;
  margin-top: 15px;
}

input, select{
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  font-size: 15px;
}

button{
  margin-top: 20px;
  width: 100%;
  padding: 10px;
  background: green;
  color: white;
  border: none;
  font-size: 16px;
  cursor: pointer;
  border-radius: 5px;
}

button:hover{
  background: darkgreen;
}

.result{
  margin-top: 20px;
  font-size: 17px;
  text-align: center;
  color: #1b5e20;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h2>🌱 Crop Spacing Calculator</h2>

<label>Unit</label>
  <select id="unit">
    <option value="cm">Centimeter (cm)</option>
    <option value="m">Meter (m)</option>
    <option value="ft">Feet (ft)</option>
  </select>
  
  <label>Row Spacing</label>
  <input type="number" id="row" placeholder="Enter value">

  <label>Plant Spacing</label>
  <input type="number" id="plant" placeholder="Enter value">

  

  <button onclick="calculate()">Calculate</button>

  <div class="result" id="output"></div>
</div>

<script>
function calculate(){
  let row = parseFloat(document.getElementById("row").value);
  let plant = parseFloat(document.getElementById("plant").value);
  let unit = document.getElementById("unit").value;

  if(isNaN(row) || isNaN(plant) || row <= 0 || plant <= 0){
    document.getElementById("output").innerText =
      "Please enter valid spacing values";
    return;
  }

  // Convert spacing to meters
  if(unit === "cm"){
    row = row / 100;
    plant = plant / 100;
  }
  else if(unit === "ft"){
    row = row * 0.3048;
    plant = plant * 0.3048;
  }
  // meter → no change

  const ACRE_M2 = 4046.86;
  const HECTARE_M2 = 10000;

  let plantsPerAcre = ACRE_M2 / (row * plant);
  let plantsPerHectare = HECTARE_M2 / (row * plant);

  document.getElementById("output").innerHTML =
    "🌾 <b>Plants per Acre:</b> " + Math.round(plantsPerAcre) +
    "<br><br>🌾 <b>Plants per Hectare:</b> " + Math.round(plantsPerHectare);
}
</script>

</body>
</html>
